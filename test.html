<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>抽卡 · 前缀工作台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,"Microsoft YaHei",sans-serif;background:#0d0824;color:#f2ecff;min-height:100vh;font-size:13px}
.app{display:grid;grid-template-columns:340px 1fr;gap:12px;padding:12px;max-width:1500px;margin:0 auto}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{height:52vh!important}}
aside{background:rgba(255,255,255,.05);border:1px solid rgba(122,90,248,.28);border-radius:12px;padding:12px;height:calc(100vh - 24px);display:flex;flex-direction:column}
main{display:flex;flex-direction:column;gap:12px;min-height:calc(100vh - 24px)}
.panel{background:rgba(255,255,255,.05);border:1px solid rgba(122,90,248,.28);border-radius:12px;padding:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select,button{background:rgba(0,0,0,.3);color:#f2ecff;border:1px solid rgba(122,90,248,.4);border-radius:8px;padding:6px 10px;font-size:13px;font-family:inherit}
button{cursor:pointer;transition:.15s}
button:hover{background:rgba(255,255,255,.09)}
button.primary{background:linear-gradient(135deg,#ffb340,#ff5b6b);border:none;color:#fff;font-weight:700}
input[type=number]{width:70px}
input[type=number].w{width:48px;padding:1px 4px;font-size:10px}
#search{width:100%;margin:8px 0}
#palette{flex:1;overflow-y:auto;margin-top:6px;padding-right:4px}
.cat{margin-bottom:6px}
.cat-h{padding:6px 8px;background:rgba(255,255,255,.04);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:600;user-select:none}
.cat-h:hover{background:rgba(255,255,255,.09)}
.cat-h small{color:#a99ade;font-weight:400}
.cat-b{display:none;padding:4px 2px}
.cat.open .cat-b{display:block}
.tag{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:5px;font-size:12px;cursor:pointer;color:#c5b8e8}
.tag:hover{background:rgba(255,255,255,.05);color:#fff}
.tag input[type=checkbox]{width:14px;height:14px;accent-color:#ff6bcb;cursor:pointer;flex:none}
.tag .tag-weight{display:none;width:42px;padding:1px 3px;font-size:10px;background:rgba(0,0,0,.4);border:1px solid rgba(122,90,248,.3);border-radius:4px}
.tag.sel .tag-weight{display:inline-block}
.tag.sel{color:#ff6bcb;background:rgba(255,107,203,.1)}
.sb-foot{padding-top:8px;border-top:1px solid rgba(122,90,248,.3);display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}
.card{background:linear-gradient(160deg,rgba(26,16,54,.9),rgba(16,9,38,.9));border:1px solid rgba(122,90,248,.28);border-left:3px solid #ff6bcb;border-radius:8px;padding:8px 10px;font-size:12px;margin:6px 0}
.card .lbl{font-weight:700;margin-bottom:2px;color:#fff}
.card .tags{color:#a99ade;line-height:1.5;word-break:break-word;font-size:11px}
.pack{border:1px solid rgba(122,90,248,.28);border-radius:10px;padding:10px;margin:8px 0;background:rgba(255,255,255,.03)}
.pack-h{font-weight:700;margin-bottom:6px;color:#ffd76b;font-size:12px}
#finalPrompt{background:rgba(0,0,0,.4);border-radius:8px;padding:10px;font-family:Consolas,monospace;font-size:12px;line-height:1.65;word-break:break-word;color:#b9e3ff;min-height:100px;max-height:230px;overflow-y:auto}
#finalNeg{background:rgba(0,0,0,.3);border-radius:8px;padding:8px;font-size:11px;color:#a99ade;line-height:1.55;min-height:44px;max-height:90px;overflow-y:auto}
h2{font-size:13px;color:#ffd76b;display:flex;align-items:center;gap:6px}
h3{font-size:12px;color:#ffd76b;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
h4{font-size:11px;color:#a99ade;margin:8px 0 4px;letter-spacing:1px}
.flash{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:#ff6bcb;color:#fff;padding:8px 18px;border-radius:22px;font-size:12px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
.flash.on{opacity:1;transform:translateX(-50%) translateY(0)}
img.gen{max-width:170px;margin:4px;border-radius:6px;cursor:zoom-in;border:1px solid rgba(122,90,248,.4)}
.empty{color:#6f6490;text-align:center;padding:28px;font-size:13px}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;background:rgba(255,107,203,.15);color:#ff6bcb;margin-left:6px}
</style>
</head>
<body>
<div class="app">
  <aside>
    <h2>🎨 前缀库 <span id="selCount" class="badge">0</span></h2>
    <input id="search" placeholder="🔍 搜索 tag，如 camera / light / smile">
    <div id="palette"></div>
    <div class="sb-foot">
      <span style="color:#a99ade">勾选=加入前缀</span>
      <div style="display:flex;gap:6px">
        <button id="btnCopyPrefix" style="padding:4px 8px;font-size:11px">复制前缀</button>
        <button id="btnClearSel" style="padding:4px 8px;font-size:11px">清空</button>
      </div>
    </div>
  </aside>

  <main>
    <div class="panel">
      <div class="row">
        <select id="comboSel" style="min-width:200px"><option>— 加载配方中 —</option></select>
        <button id="btnLoadCombos">刷新配方</button>
        <span style="color:#a99ade">×</span>
        <input type="number" id="pulls" value="3" min="1" max="10" style="width:56px">
        <input type="number" id="seed" placeholder="seed" style="width:90px">
        <button id="btnDraw" class="primary">🎲 抽卡</button>
        <span style="color:#a99ade;margin-left:auto" id="statusBar">检查服务器中…</span>
      </div>
    </div>

    <div class="panel" style="flex:1;overflow-y:auto;max-height:40vh">
      <h3>抽卡结果 <span style="color:#6f6490;font-size:11px;font-weight:400">（点抽卡后显示）</span></h3>
      <div id="results"><div class="empty">选一个配方 → 点抽卡</div></div>
    </div>

    <div class="panel">
      <h3>最终 Prompt
        <button id="btnCopy" style="font-size:11px;padding:3px 8px">📋 复制</button>
      </h3>
      <div id="finalPrompt">（未抽卡 / 未选前缀）</div>
      <h4>Negative</h4>
      <div id="finalNeg">（未选）</div>
      <div class="row" style="margin-top:10px;justify-content:flex-end">
        <button id="btnGen" class="primary">✨ 送 ComfyUI 生图</button>
      </div>
      <div id="genOut" style="display:flex;flex-wrap:wrap;margin-top:8px"></div>
    </div>
  </main>
</div>
<div class="flash" id="flash"></div>

<script>
/* ============ 前缀库 ============ */
const PREFIX_LIB = {
  quality: {label:"质量", items:["masterpiece","best quality","score_7","highres","absurdres","ultra detailed","sharp focus","official art","anime screenshot","key visual","detailed face","detailed eyes"]},
  era: {label:"年代", items:["year 2025","newest","recent","year 2020","1990s anime style","retro anime","cel shading","film grain","vintage color"]},
  style: {label:"风格", items:["anime style","illustration","digital painting","watercolor","flat color","thick lineart","thin lineart","painterly","sketch","monochrome","pastel","dark fantasy","cyberpunk","traditional media","gorgeous","detailed"]},
  character: {label:"角色基础", items:["1girl","1boy","solo","2girls","full body","upper body","cowboy shot","portrait","detailed hair","flowing hair","beautiful","cute"]},
  camera: {label:"镜头", items:["cinematic composition","wide shot","medium shot","close-up","extreme close-up","dutch angle","low angle","high angle","bird's eye view","over-the-shoulder","fisheye","telephoto","wide angle lens","shallow depth of field","bokeh","foreground blur","rule of thirds","centered composition","negative space","depth of field"]},
  light: {label:"光照", items:["soft lighting","hard light","rim light","backlight","golden hour","blue hour","sunset light","moonlight","candlelight","neon light","volumetric light","god rays","lens flare","anamorphic","dappled light","studio lighting","high key","low key","chiaroscuro","silhouette","bloom","subsurface scattering"]},
  color: {label:"配色", items:["warm color palette","cool color palette","high saturation","low saturation","muted colors","vibrant colors","pastel colors","monochrome palette","teal and orange","complementary colors","gradient background","color splash","duotone"]},
  mood: {label:"情绪", items:["gentle smile","confident smirk","shy expression","blank stare","melancholic","serene","tense","playful","dignified","cold","wistful","determined","surprised","blushing","half-lidded eyes","open mouth","closed mouth","parted lips"]},
  pose: {label:"姿态", items:["dynamic pose","static pose","contrapposto","action pose","leaning forward","arms crossed","hands on hips","looking at viewer","looking away","profile","from side","three-quarter view","sitting","standing","walking","running"]},
  negative: {label:"负面默认", items:["worst quality","low quality","score_1","score_2","score_3","artist name","blurry","jpeg artifacts","chromatic aberration","bad hands","extra fingers","missing fingers","fused fingers","deformed","mutated","extra limbs","bad anatomy","watermark","signature","text","username","logo","3d","realistic","photo","nsfw","explicit","nude","spread legs","open legs","upskirt","panty shot","cleavage focus"]}
};

/* 默认勾选的负面（第一次打开就带，省得每次都手选） */
const DEFAULT_NEG = ["worst quality","low quality","blurry","bad hands","extra fingers","deformed","watermark","text","nsfw","explicit","nude","spread legs","open legs","upskirt","panty shot"];

/* ============ 状态 ============ */
const state = {
  sel: {},        // {cat: {tag: weight}}
  draws: [],
  allRecipes: [],
  server: false
};
/* 默认负面进入选择池 */
state.sel.negative = {};
DEFAULT_NEG.forEach(t => { state.sel.negative[t] = 1.0; });

/* ============ 工具 ============ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const flash = msg => { const f=$("flash"); f.textContent=msg; f.classList.add("on"); setTimeout(()=>f.classList.remove("on"), 1800); };

/* ============ 渲染前缀库 ============ */
function renderPalette(filter) {
  filter = filter || "";
  const f = filter.trim().toLowerCase();
  let html = "";
  let totalMatches = 0;
  for (const [cat, def] of Object.entries(PREFIX_LIB)) {
    const items = def.items.filter(t => !f || t.toLowerCase().includes(f));
    if (!items.length) continue;
    totalMatches += items.length;
    const selInCat = Object.keys(state.sel[cat] || {}).length;
    const open = (f || selInCat) ? "open" : "";
    const rows = items.map(t => {
      const w = (state.sel[cat] || {})[t];
      const isSel = w !== undefined;
      const weightVal = isSel ? w : 1.0;
      return `<label class="tag ${isSel?"sel":""}" data-cat="${cat}" data-tag="${esc(t)}">
        <input type="checkbox" ${isSel?"checked":""}>
        <span style="flex:1">${esc(t)}</span>
        <input type="number" class="tag-weight" step="0.1" min="0.1" max="2" value="${weightVal}" title="权重">
      </label>`;
    }).join("");
    html += `<div class="cat ${open}" data-cat="${cat}">
      <div class="cat-h">
        <span>${def.label} <small>${items.length}${selInCat?` · 选 ${selInCat}`:""}</small></span>
        <span>▾</span>
      </div>
      <div class="cat-b">${rows}</div>
    </div>`;
  }
  $("palette").innerHTML = html || `<div class="empty" style="padding:20px 0">没有匹配项</div>`;
  bindPalette();
  updateSelCount();
  updateFinalPrompt();
}

function bindPalette() {
  document.querySelectorAll("#palette .cat-h").forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle("open");
  });
  document.querySelectorAll("#palette .tag").forEach(el => {
    const cat = el.dataset.cat, tag = el.dataset.tag;
    const cb = el.querySelector("input[type=checkbox]");
    const wt = el.querySelector(".tag-weight");
    cb.onchange = () => {
      state.sel[cat] = state.sel[cat] || {};
      if (cb.checked) state.sel[cat][tag] = parseFloat(wt.value) || 1.0;
      else delete state.sel[cat][tag];
      if (!Object.keys(state.sel[cat]).length) delete state.sel[cat];
      el.classList.toggle("sel", cb.checked);
      updateSelCount();
      updateFinalPrompt();
    };
    wt.oninput = () => {
      if (state.sel[cat] && state.sel[cat][tag] !== undefined) {
        state.sel[cat][tag] = parseFloat(wt.value) || 1.0;
        updateFinalPrompt();
      }
    };
    wt.onclick = e => e.stopPropagation();
  });
}

function updateSelCount() {
  let n = 0;
  Object.values(state.sel).forEach(m => n += Object.keys(m).length);
  $("selCount").textContent = n;
}

/* ============ 拼装 prompt ============ */
function getPrefixTags() {
  const out = [];
  for (const [cat, m] of Object.entries(state.sel)) {
    if (cat === "negative") continue;
    for (const [t, w] of Object.entries(m)) {
      out.push(w !== 1.0 ? `(${t}:${w})` : t);
    }
  }
  return out;
}

function getNegativeTags() {
  return Object.keys(state.sel.negative || {});
}

function buildCardTags(card) {
  return (card || [])
    .map(it => it.tags || "")
    .filter(t => t && !/[\u4e00-\u9fff]/.test(t));
}

function updateFinalPrompt() {
  const prefixes = getPrefixTags();
  const cards = state.draws.flatMap(c => buildCardTags(c));
  const all = [...prefixes, ...cards];
  $("finalPrompt").textContent = all.join(", ") || "（未抽卡 / 未选前缀）";
  const negs = getNegativeTags();
  $("finalNeg").textContent = negs.join(", ") || "（无）";
}

/* ============ 服务器交互 ============ */
async function checkServer() {
  try {
    const r = await fetch("/data", {mode: "cors"});
    if (r.ok) { state.server = true; $("statusBar").textContent = "🟢 服务器在线"; return true; }
  } catch (e) {}
  state.server = false;
  $("statusBar").textContent = "🔴 服务器未启动";
  return false;
}

async function loadCombos() {
  if (!state.server) return;
  try {
    const r = await fetch("/api/combos", {mode: "cors"});
    const d = await r.json();
    if (d.ok && d.combos) {
      state.allRecipes = d.combos;
      if (!d.combos.length) {
        $("comboSel").innerHTML = `<option value="">（combos/ 目录为空，去原 gacha.html 存一个）</option>`;
        flash("没有配方，请先在原页面存一个");
        return;
      }
      $("comboSel").innerHTML = d.combos.map(c =>
        `<option value="${esc(c.file)}">${esc(c.name)}</option>`
      ).join("");
      flash(`已加载 ${d.combos.length} 个配方`);
    }
  } catch (e) {
    flash("配方加载失败");
  }
}

async function doDraw() {
  if (!state.server) { flash("服务器未连接，请先 gacha_start.bat"); return; }
  const file = $("comboSel").value;
  const rec = state.allRecipes.find(x => x.file === file);
  if (!rec) { flash("配方不存在"); return; }
  const pulls = Math.max(1, parseInt($("pulls").value) || 1);
  const rawSeed = $("seed").value.trim();
  const seed = rawSeed === "" ? null : parseInt(rawSeed);
  $("statusBar").textContent = "⏳ 抽卡中…";
  try {
    const r = await fetch("/api/combo/run", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({recipe: rec.recipe, pulls, seed})
    });
    const d = await r.json();
    if (d.ok && d.draws) {
      state.draws = d.draws.map(x => detailToCard(x.detail || []));
      renderResults();
      updateFinalPrompt();
      $("statusBar").textContent = `✅ 完成 ${d.draws.length} 抽`;
    } else {
      $("statusBar").textContent = "❌ " + (d.error || "失败");
      flash("抽卡失败: " + (d.error || "?"));
    }
  } catch (e) {
    $("statusBar").textContent = "❌ 请求错误";
    flash("请求失败");
  }
}

function detailToCard(detail) {
  const card = [];
  (detail || []).forEach(d => {
    if (d.skipped) return;
    (d.tags || []).forEach(t => {
      const isCJK = /[\u4e00-\u9fff]/.test(t);
      card.push({
        pool: d.slot || "",
        tags: t,
        label: isCJK ? t : t
      });
    });
  });
  return card;
}

function renderResults() {
  const root = $("results");
  if (!state.draws.length) { root.innerHTML = `<div class="empty">暂无结果</div>`; return; }
  root.innerHTML = state.draws.map((card, i) => `
    <div class="pack">
      <div class="pack-h">🎴 第 ${i+1} 抽 · ${card.length} 项</div>
      ${card.map(it => {
        const isCJK = /[\u4e00-\u9fff]/.test(it.tags);
        return `<div class="card">
          <div class="lbl">${esc(it.label || it.tags)} ${isCJK?'<span style="color:#6f6490;font-size:10px">（中文，不进 prompt）</span>':''}</div>
          <div class="tags">${esc(it.tags)}</div>
        </div>`;
      }).join("")}
    </div>`).join("");
}

/* ============ 复制 / 生图 ============ */
function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => flash("已复制")).catch(() => fallbackCopy(text));
  } else fallbackCopy(text);
}
function fallbackCopy(t) {
  const ta = document.createElement("textarea");
  ta.value = t; document.body.appendChild(ta);
  ta.select(); try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  flash("已复制");
}

async function doGenerate() {
  if (!state.server) { flash("服务器未连接"); return; }
  const prompt = $("finalPrompt").textContent;
  if (!prompt || prompt.startsWith("（")) { flash("没有 prompt"); return; }
  const neg = $("finalNeg").textContent;
  $("genOut").innerHTML = `<span style="color:#a99ade">⏳ 生成中…</span>`;
  try {
    const r = await fetch("/api/generate", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        prompts: [prompt],
        negative: neg,
        engine: "anima",     // AnimaTurbo
        steps: 10,
        cfg: 1.0,
        width: 1024,
        height: 1344,
        model: "illustrious"
      })
    });
    const d = await r.json();
    if (d.ok && d.urls && d.urls.length) {
      $("genOut").innerHTML = d.urls.map(u =>
        `<img class="gen" src="${esc(u)}" onclick="window.open('${esc(u)}')">`
      ).join("");
    } else {
      $("genOut").innerHTML = `<span style="color:#ff5b5b">❌ ${esc(d.error || "生成失败")}</span>`;
    }
  } catch (e) {
    $("genOut").innerHTML = `<span style="color:#ff5b5b">❌ ${esc(e.message)}</span>`;
  }
}

/* ============ 绑定 ============ */
$("search").oninput = () => renderPalette($("search").value);
$("btnClearSel").onclick = () => { state.sel = { negative: {} }; renderPalette($("search").value); };
$("btnCopyPrefix").onclick = () => copyText(getPrefixTags().join(", "));
$("btnCopy").onclick = () => copyText($("finalPrompt").textContent);
$("btnLoadCombos").onclick = loadCombos;
$("btnDraw").onclick = doDraw;
$("btnGen").onclick = doGenerate;

/* ============ 启动 ============ */
(async () => {
  renderPalette("");
  await checkServer();
  if (state.server) await loadCombos();
})();
</script>
</body>
</html>
